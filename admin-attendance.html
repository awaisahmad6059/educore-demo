<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Attendance Report - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Attendance Report</h1><div class="sub">Class-wise attendance view karein filters ke saath.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="toolbar">
      <div class="form-row" style="margin:0"><label style="margin-bottom:4px">From</label><input type="date"/></div>
      <div class="form-row" style="margin:0"><label style="margin-bottom:4px">To</label><input type="date"/></div>
      <div class="form-row" style="margin:0"><label style="margin-bottom:4px">Class</label><select><option>Grade 8-A</option><option>Grade 9-B</option><option>Grade 10-A</option><option>Grade 5-B</option></select></div>
      <button class="btn btn-primary" onclick="showMsg('Report filtered (demo).')" style="margin-top:18px">Apply Filter</button>
      <button class="btn btn-outline" onclick="showMsg('Excel/PDF export backend demo mein nahi hai - real system mein hoga.')" style="margin-top:18px">Export</button>
    </div>
    <div class="panel">
      <h3>Attendance Summary</h3>
      <div class="grid-3">
        <div class="kpi" style="padding:16px"><div class="k-num" style="font-size:24px;color:var(--success)">85.4%</div><div class="k-lbl">Overall</div></div>
        <div class="kpi" style="padding:16px"><div class="k-num" style="font-size:24px;color:var(--primary)">719</div><div class="k-lbl">Present</div></div>
        <div class="kpi" style="padding:16px"><div class="k-num" style="font-size:24px;color:var(--danger)">123</div><div class="k-lbl">Absent / Late</div></div>
      </div>
      <table class="tbl">
        <thead><tr><th>Student</th><th>Class</th><th>Days Pres.</th><th>%</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>Ahmed Raza</td><td>Grade 8-A</td><td>24</td><td>92%</td><td><span class="badge green">Good</span></td></tr>
          <tr><td>Ali Hassan</td><td>Grade 8-A</td><td>19</td><td>73%</td><td><span class="badge red">Low</span></td></tr>
          <tr><td>Saad Khan</td><td>Grade 9-B</td><td>18</td><td>69%</td><td><span class="badge red">Low</span></td></tr>
          <tr><td>Fatima Noor</td><td>Grade 5-B</td><td>25</td><td>96%</td><td><span class="badge green">Good</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="app.js"></script>
<script>
(function(){ var u=guard(['admin','superadmin']); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Attendance','admin'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>'; })();
</script>
</body>
</html>
