<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>School Setup - EduCore Super Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>School Setup</h1><div class="sub">Mulk ya campus level par settings — academic year, grading, terms.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3>School / Campus</h3>
        <div class="form-row"><label>School Name</label><input id="s_name" value="EduCore International School" onchange="saveField('name',this.value)"/></div>
        <div class="form-row"><label>Academic Year</label><input id="s_year" value="2026-2027" onchange="saveField('year',this.value)"/></div>
        <div class="form-row"><label>Term</label><select id="s_term" onchange="saveField('term',this.value)"><option>Term 1</option><option>Term 2</option><option>Final</option></select></div>
        <div class="form-row"><label>Number of Campuses</label><input type="number" id="s_campus" value="1" onchange="saveField('campus',this.value)"/></div>
        <div class="form-row"><label>Currency</label><select id="s_curr" onchange="saveField('currency',this.value)"><option>USD ($)</option><option>PKR (Rs)</option><option>GBP (£)</option></select></div>
      </div>
      <div class="panel">
        <h3>Grading System</h3>
        <table class="tbl">
          <thead><tr><th>Grade</th><th>Range</th><th>Note</th></tr></thead>
          <tbody>
            <tr><td>A+</td><td>90–100</td><td>Outstanding</td></tr>
            <tr><td>A</td><td>80–89</td><td>Excellent</td></tr>
            <tr><td>B+</td><td>70–79</td><td>Good</td></tr>
            <tr><td>B</td><td>60–69</td><td>Pass</td></tr>
            <tr><td>C</td><td>50–59</td><td>Fair</td></tr>
            <tr><td>F</td><td>0–49</td><td>Fail</td></tr>
          </tbody>
        </table>
        <div class="form-actions"><button class="btn btn-primary" onclick="showMsg('Grading scale demo — real system mein editable scale hota hai.')">Edit Grading</button></div>
      </div>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
(function(){ var u=guard('superadmin'); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('School Setup','superadmin'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>Super Admin</span></div>'; })();
function saveField(k,v){ showMsg('Setting "'+k+'" = '+v+' save ho gayi (demo).'); }
</script>
</body>
</html>
