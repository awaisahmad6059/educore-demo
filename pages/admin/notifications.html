<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Notifications - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Notifications</h1><div class="sub">Students, parents aur teachers ko notification bhejein.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3>Compose Notification</h3>
        <div class="form-row"><label>Title</label><input id="n_title" placeholder="e.g. School closed on Monday"/></div>
        <div class="form-row"><label>Message</label><textarea id="n_msg" placeholder="Enter your message..."></textarea></div>
        <div class="form-grid">
          <div class="form-row"><label>Type</label><select id="n_type"><option>General</option><option>Exam</option><option>Fee</option><option>Event</option><option>Emergency</option></select></div>
          <div class="form-row"><label>Recipients</label><select id="n_rec"><option>All Students</option><option>All Parents</option><option>All Teachers</option><option>Specific Class</option></select></div>
        </div>
        <div class="form-actions"><button class="btn btn-primary" onclick="sendNotif()">Send Notification</button></div>
      </div>
      <div class="panel">
        <h3>Notification History</h3>
        <table class="tbl"><tbody id="nBody"></tbody></table>
      </div>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
var sent=[{title:'Midterm results published',type:'Result',rec:'All Students',read:'65%'},{title:'Fee reminder',type:'Fee',rec:'All Parents',read:'40%'}];
(function(){ var u=guard(['admin','superadmin']); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Notifications','admin'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>'; renderN(); })();
function renderN(){ document.getElementById('nBody').innerHTML=sent.length?
  '<tr><th>Title</th><th>Type</th><th>Recipients</th><th>Read %</th></tr>'+
  sent.map(function(x){return '<tr><td><b>'+esc(x.title)+'</b></td><td><span class="badge blue">'+esc(x.type)+'</span></td><td>'+esc(x.rec)+'</td><td>'+x.read+'</td></tr>';}).join('')
  :'<tr><td style="color:var(--slate);text-align:center">Koi notification nahi bheja.</td></tr>'; }
function sendNotif(){
  var t=document.getElementById('n_title').value.trim();
  var m=document.getElementById('n_msg').value.trim();
  if(!t||!m){ showMsg('Title aur message likhein.'); return; }
  sent.unshift({title:t,type:document.getElementById('n_type').value,rec:document.getElementById('n_rec').value,read:'0%'});
  showMsg('Notification bhej di gayi (in-app + email).');
  document.getElementById('n_title').value=''; document.getElementById('n_msg').value=''; renderN();
}
</script>
</body>
</html>
