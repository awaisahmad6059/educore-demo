<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Audit Logs - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Audit Logs</h1><div class="sub">Har admin action ka record - kis ne, kya aur kab kiya.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="panel">
      <table class="tbl">
        <thead><tr><th>Actor</th><th>Action</th><th>Resource</th><th>Time</th><th>IP</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
(function(){
  var u=guard(['admin','superadmin']); if(!u) return;
  document.getElementById('sidebar').innerHTML=buildSidebar('Audit Logs','admin');
  document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>';
  var s=loadStore();
  var logs=(s.audit&&s.audit.length)?s.audit:[
    {action:'Created student',user:'Admin',time:'Today 9:10 AM',resource:'Students'},
    {action:'Recorded payment',user:'Admin',time:'Today 9:05 AM',resource:'Fees'},
    {action:'Published results',user:'Admin',time:'Yesterday 4:30 PM',resource:'Results'}
  ];
  document.getElementById('tbody').innerHTML=logs.map(function(x){return '<tr><td><b>'+esc(x.user)+'</b></td><td>'+esc(x.action)+'</td><td><span class="badge blue">'+esc(x.resource)+'</span></td><td>'+esc(x.time)+'</td><td style="color:var(--slate)">192.168.1.'+(Math.floor(Math.random()*200)+1)+'</td></tr>';}).join('');
})();
</script>
</body>
</html>
