<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Exams &amp; Results - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Exams &amp; Results</h1><div class="sub">Exam schedule karein, teacher ka enter kiya hua results review karein aur publish karein.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openAdd()">+ Schedule Exam</button>
      <button class="btn btn-outline" onclick="showMsg('Unpublished results filter (demo)')">View Unpublished</button>
    </div>

    <div class="panel">
      <h3>Exams</h3>
      <table class="tbl">
        <thead><tr><th>Exam</th><th>Class</th><th>Subject</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="examBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Review Results - Midterm (Grade 8-A)</h3>
      <table class="tbl">
        <thead><tr><th>Student</th><th>Marks</th><th>Total</th><th>Grade</th><th>Publish</th></tr></thead>
        <tbody>
          <tr><td>Ahmed Raza</td><td>88</td><td>100</td><td><span class="badge green">A</span></td><td><span class="badge amber">Pending</span></td></tr>
          <tr><td>Ali Hassan</td><td>62</td><td>100</td><td><span class="badge amber">C</span></td><td><span class="badge amber">Pending</span></td></tr>
        </tbody>
      </table>
      <div class="form-actions"><button class="btn btn-primary" onclick="publishResults()">Publish Results</button></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-head"><h3>Schedule Exam</h3><button class="close-x" onclick="closeModal('addModal')">✕</button></div>
    <div class="form-grid">
      <div class="form-row"><label>Exam Type</label><select id="e_type"><option>Midterm</option><option>Final</option><option>Quiz</option><option>Test</option></select></div>
      <div class="form-row"><label>Class</label><select id="e_cls"><option>Grade 8-A</option><option>Grade 9-B</option><option>Grade 10-A</option></select></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Subject</label><select id="e_sub"></select></div>
      <div class="form-row"><label>Date</label><input type="date" id="e_date" value="2026-09-10"/></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Total Marks</label><input type="number" id="e_total" value="100"/></div>
      <div class="form-row"><label>Passing Marks</label><input type="number" id="e_pass" value="40"/></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveExam()">Schedule Exam</button>
    </div>
  </div>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
(function(){
  var u=guard(['admin','superadmin']); if(!u) return;
  document.getElementById('sidebar').innerHTML=buildSidebar('Exams','admin');
  document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>';
  renderSubs(); renderExams();
})();
function renderSubs(){
  var subs=(loadStore().subjects||[]).map(function(x){return x.name;});
  var list=subs.length?subs:['Mathematics','Algebra','English'];
  document.getElementById('e_sub').innerHTML=list.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
}
function openAdd(){ openModal('addModal'); }
function renderExams(){
  var s=loadStore().exams;
  var cls={scheduled:'blue',active:'amber','result-pending':'amber',published:'green'};
  var h='';
  s.forEach(function(x){
    var st=x.status||'scheduled';
    h+='<tr><td>'+esc(x.name)+'</td><td>'+esc(x.class)+'</td><td>'+esc(x.subject)+'</td><td>'+x.date+'</td><td><span class="badge '+(cls[st]||'blue')+'">'+st.replace('-',' ')+'</span></td>'+
    '<td>'+(st==='result-pending'?'<button class="btn btn-sm btn-primary" onclick="showMsg(\'Results review upar hai - marks enter ho chuke hain.\')">Review</button>':'<span class="badge gray">-</span>')+'</td></tr>';
  });
  document.getElementById('examBody').innerHTML=h;
}
function saveExam(){
  var type=document.getElementById('e_type').value;
  var s=loadStore();
  var newId=Math.max.apply(null, s.exams.map(function(x){return x.id;}))+1;
  s.exams.push({id:newId,name:type,class:document.getElementById('e_cls').value,subject:document.getElementById('e_sub').value,date:document.getElementById('e_date').value,total:parseInt(document.getElementById('e_total').value)||100,status:'scheduled'});
  saveStore(s);
  showMsg(type+' exam schedule ho gaya.'); closeModal('addModal'); renderExams();
}
function publishResults(){ showMsg('Results publish ho gaye - students ko ab visible hain.'); }
</script>
</body>
</html>
