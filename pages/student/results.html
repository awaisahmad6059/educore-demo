<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Results - EduCore Student</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>My Results</h1><div class="sub">View your exam marks, grades and position after admin publishes results.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="k-ico" style="background:rgba(45,91,227,.12)">🎯</div><div class="k-num">85%</div><div class="k-lbl">Overall</div></div>
      <div class="kpi"><div class="k-ico" style="background:rgba(22,163,74,.12)">🏅</div><div class="k-num">#3</div><div class="k-lbl">Class Rank</div></div>
    </div>
    <div class="panel">
      <h3>Midterm Results — Grade 8-A</h3>
      <table class="tbl">
        <thead><tr><th>Subject</th><th>Marks</th><th>Total</th><th>Grade</th></tr></thead>
        <tbody>
          <tr><td>Mathematics</td><td>88</td><td>100</td><td><span class="badge green">A</span></td></tr>
          <tr><td>English</td><td>79</td><td>100</td><td><span class="badge blue">B+</span></td></tr>
          <tr><td>Science</td><td>91</td><td>100</td><td><span class="badge green">A+</span></td></tr>
          <tr><td>Urdu</td><td>84</td><td>100</td><td><span class="badge green">A</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
(function(){ var u=guard('student'); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Results','student'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>Student</span></div>'; })();
</script>
</body>
</html>
