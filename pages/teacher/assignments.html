<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Assignments - EduCore Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Assignments</h1><div class="sub">Assignment upload karein aur dekhein kon se student ne submit kiya.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openModal('addModal')">+ Upload Assignment</button>
    </div>
    <div class="panel">
      <h3>My Assignments &amp; Submissions</h3>
      <table class="tbl">
        <thead><tr><th>Assignment</th><th>Class</th><th>Subject</th><th>Due</th><th>Format</th><th>Submissions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-head"><h3>Upload Assignment</h3><button class="close-x" onclick="closeModal('addModal')">✕</button></div>
    <div class="form-row"><label>Title</label><input id="a_title" placeholder="e.g. Algebra Homework #5"/></div>
    <div class="form-grid">
      <div class="form-row"><label>Class</label><select id="a_cls"><option>Grade 8-A</option><option>Grade 9-B</option><option>Grade 10-A</option><option>Grade 5-B</option></select></div>
      <div class="form-row"><label>Subject</label><select id="a_sub"></select></div>
    </div>
    <div class="form-row"><label>Due Date</label><input type="date" id="a_due" value="2026-09-10"/></div>
    <div class="form-row"><label>Attachment (template)</label>
      <div class="dropzone" onclick="document.getElementById('a_file').click()" id="dz">
        <div style="font-size:26px">📎</div>
        <div><b>Click to upload</b><br/><span style="font-size:12px;color:var(--slate)">PDF, DOCX, or image (max 10MB)</span></div>
      </div>
      <input type="file" id="a_file" hidden onchange="filePick(this)"/>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAssign()">Upload Assignment</button>
    </div>
  </div>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
var aFileName='';
(function(){
  var u=guard('teacher'); if(!u) return;
  document.getElementById('sidebar').innerHTML=buildSidebar('Assignments','teacher');
  document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>Teacher</span></div>';
  renderSubs(); render();
})();
function renderSubs(){
  var subs=(loadStore().subjects||[]).map(function(x){return x.name;});
  var list=subs.length?subs:['Mathematics','Algebra','Science','English'];
  document.getElementById('a_sub').innerHTML=list.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
}
function render(){
  var s=loadStore();
  var assigns=s.assignments;
  var subs=s.submissions||[];
  var h=assigns.map(function(x){
    var badge=x.type==='pdf'?'<span class="badge red">PDF</span>':(x.type==='docx'?'<span class="badge blue">DOCX</span>':'<span class="badge amber">Image</span>');
    var mine=subs.filter(function(sb){ return sb.assignId===x.id; });
    var subHtml;
    if(mine.length){
      subHtml='<button class="btn btn-sm btn-outline" onclick="toggleSubs('+x.id+')">'+mine.length+' submitted</button>'+
      '<div id="subs_'+x.id+'" style="display:none;margin-top:8px">'+
      mine.map(function(sb){ return '<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--cloud)"><b>'+esc(sb.student)+'</b> - '+esc(sb.file)+'<br/><span style="color:var(--slate);font-size:11px">'+sb.date+'</span></div>'; }).join('')+
      '</div>';
    } else { subHtml='<span class="badge gray">No submissions</span>'; }
    return '<tr><td><b>'+esc(x.title)+'</b></td><td>'+x.class+'</td><td>'+x.subject+'</td><td>'+x.due+'</td><td>'+badge+'</td><td>'+subHtml+'</td></tr>';
  }).join('');
  if(!h) h='<tr><td colspan="6" style="text-align:center;color:var(--slate);padding:24px">Koi assignment nahi - upar upload karein.</td></tr>';
  document.getElementById('tbody').innerHTML=h;
}
function toggleSubs(id){ var el=document.getElementById('subs_'+id); el.style.display=el.style.display==='none'?'block':'none'; }
function filePick(inp){
  aFileName=inp.files&&inp.files[0]?inp.files[0].name:'';
  var dz=document.getElementById('dz');
  if(aFileName){ dz.style.borderColor='var(--success)'; dz.lastElementChild.firstElementChild.textContent='Selected: '+aFileName; }
}
function saveAssign(){
  var t=document.getElementById('a_title').value.trim();
  if(!t){ showMsg('Assignment ka title likhein.'); return; }
  var type=aFileName? aFileName.split('.').pop().toLowerCase() : 'pdf';
  var s=loadStore();
  var newId=Math.max.apply(null,s.assignments.map(function(x){return x.id;}))+1;
  var cu=getCurrentUser();
  s.assignments.push({id:newId,title:t,subject:document.getElementById('a_sub').value,teacher:(cu&&cu.name)||'Ms. Ahmed',class:document.getElementById('a_cls').value,due:document.getElementById('a_due').value,type:type});
  saveStore(s);
  showMsg('Assignment "'+t+'" upload ho gayi.');
  closeModal('addModal'); aFileName=''; document.getElementById('a_title').value=''; var dz=document.getElementById('dz'); dz.style.borderColor=''; dz.lastElementChild.firstElementChild.textContent='Click to upload';
  render();
}
</script>
</body>
</html>
