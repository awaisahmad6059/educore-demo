<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Performance - EduCore Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Class Performance</h1><div class="sub">Track your classes' exam averages and attendance trends.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="k-ico" style="background:rgba(45,91,227,.12)">📊</div><div class="k-num">78.5%</div><div class="k-lbl">Average Score</div></div>
      <div class="kpi"><div class="k-ico" style="background:rgba(217,119,6,.12)">🧮</div><div class="k-num">88%</div><div class="k-lbl">Attendance Rate</div></div>
      <div class="kpi"><div class="k-ico" style="background:rgba(22,163,74,.12)">✅</div><div class="k-num">92%</div><div class="k-lbl">Assignments Submitted</div></div>
    </div>
    <div class="panel">
      <h3>Class Averages</h3>
      <table class="tbl">
        <thead><tr><th>Class</th><th>Midterm Avg</th><th>Attendance</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>Grade 8-A</td><td>82%</td><td>85%</td><td><span class="badge green">Good</span></td></tr>
          <tr><td>Grade 9-B</td><td>74%</td><td>80%</td><td><span class="badge amber">Average</span></td></tr>
          <tr><td>Grade 10-A</td><td>69%</td><td>72%</td><td><span class="badge red">Needs attention</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="../../assets/js/app.js"></script>
<script>
(function(){ var u=guard('teacher'); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Performance','teacher'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>Teacher</span></div>'; })();
</script>
</body>
</html>
