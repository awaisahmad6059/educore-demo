<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Settings - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Settings</h1><div class="sub">School profile, academic year aur role management.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3>School Profile</h3>
        <div class="form-row"><label>School Name</label><input id="s_name" value="EduCore International School"/></div>
        <div class="form-grid">
          <div class="form-row"><label>Academic Year</label><input id="s_year" value="2026-2027"/></div>
          <div class="form-row"><label>Term</label><select id="s_term"><option>Term 1</option><option>Term 2</option><option>Final</option></select></div>
        </div>
        <div class="form-row"><label>Contact</label><input id="s_contact" value="+92 300 1234567"/></div>
        <div class="form-actions"><button class="btn btn-primary" onclick="showMsg('School profile saved.')">Save</button></div>
      </div>
      <div class="panel">
        <h3>Role Management</h3>
        <table class="tbl">
          <thead><tr><th>Role</th><th>Users</th><th>Permissions</th></tr></thead>
          <tbody>
            <tr><td>Super Admin</td><td>1</td><td><span class="badge green">Full</span></td></tr>
            <tr><td>Admin</td><td>3</td><td><span class="badge blue">All modules</span></td></tr>
            <tr><td>Teacher</td><td>48</td><td><span class="badge amber">Class only</span></td></tr>
            <tr><td>Student</td><td>842</td><td><span class="badge gray">View only</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="app.js"></script>
<script>
(function(){ var u=guard(['admin','superadmin']); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Settings','admin'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>'; })();
</script>
</body>
</html>
