<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Change Password - EduCore Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Change Password</h1><div class="sub">Apna password update karein — agli baar isi se login hoga.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="panel" style="max-width:520px">
      <div class="form-row"><label>Current Password</label><input type="password" id="cur"/></div>
      <div class="form-row"><label>New Password</label><input type="password" id="new1" placeholder="min 4 characters"/></div>
      <div class="form-row"><label>Confirm New Password</label><input type="password" id="new2"/></div>
      <div class="form-actions"><button class="btn btn-primary" onclick="changeMe()">Update Password</button></div>
    </div>
  </main>
</div>
<div class="msg" id="msg"></div>
<script src="app.js"></script>
<script>
(function(){ var u=guard('teacher'); if(!u) return; document.getElementById('sidebar').innerHTML=buildSidebar('Change Password','teacher'); document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>Teacher</span></div>'; })();
function changeMe(){
  var cu=getCurrentUser();
  var cur=document.getElementById('cur').value, n1=document.getElementById('new1').value, n2=document.getElementById('new2').value;
  if(String(cu.pass)!==cur){ showMsg('Current password galat hai.'); return; }
  if(n1.length<4){ showMsg('New password kam se kam 4 characters.'); return; }
  if(n1!==n2){ showMsg('New password aur confirm match nahi kar rahe.'); return; }
  if(changePassword(cu.email,cu.role,n1)){ showMsg('Password change ho gaya ✔ (demo: ab isi se login hota hai)'); document.getElementById('cur').value=''; document.getElementById('new1').value=''; document.getElementById('new2').value=''; }
}
</script>
</body>
</html>
