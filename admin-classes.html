<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Classes - EduCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Classes &amp; Sections</h1><div class="sub">Set up academic structure - grades, sections, subjects aur in-charge teacher.</div></div>
      <div class="user-chip" id="userchip"></div>
    </div>
    <div class="grid-3" id="classGrid"></div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn btn-primary" onclick="openAdd()">+ Add Class</button>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-head"><h3>Add Class</h3><button class="close-x" onclick="closeModal('addModal')">✕</button></div>
    <div class="form-grid">
      <div class="form-row"><label>Grade</label><select id="c_grade"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
      <div class="form-row"><label>Section</label><select id="c_sec"><option>A</option><option>B</option><option>C</option></select></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Academic Year</label><input id="c_year" value="2026-2027"/></div>
      <div class="form-row"><label>Max Capacity</label><input id="c_cap" type="number" value="40"/></div>
    </div>
    <div class="form-row"><label>In-Charge Teacher</label><select id="c_teacher"></select></div>
    <div class="form-row"><label>Subjects (multi-select)</label>
      <div id="subjChips"></div>
      <div style="font-size:11px;color:var(--slate);margin-top:4px">Subject click karke select/deslect karein - agar subject koi nahi hai to pehle Admin &gt; Subjects se add karein.</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveClass()">Save Class</button>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>
<script src="app.js"></script>
<script>
var selSubs=[];
var classes=[
  {id:1,name:'Grade 8-A',grade:8,sec:'A',teacher:'Ms. Ahmed',teacherId:1,students:35,subs:['Mathematics','English','Science']},
  {id:2,name:'Grade 9-B',grade:9,sec:'B',teacher:'Ms. Ahmed',teacherId:1,students:30,subs:['Mathematics','Physics']},
  {id:3,name:'Grade 10-A',grade:10,sec:'A',teacher:'Ms. Ahmed',teacherId:1,students:30,subs:['Algebra','English']},
  {id:4,name:'Grade 5-B',grade:5,sec:'B',teacher:'Mr. Khan',teacherId:2,students:38,subs:['English','Science']},
  {id:5,name:'Grade 3-A',grade:3,sec:'A',teacher:'Ms. Iqbal',teacherId:3,students:42,subs:['Science','Urdu']}
];
(function(){
  var u=guard(['admin','superadmin']); if(!u) return;
  document.getElementById('sidebar').innerHTML=buildSidebar('Classes','admin');
  document.getElementById('userchip').innerHTML='<div class="ava">'+letterAvatar(u.email)+'</div><div><b>'+u.email+'</b><span>'+roleLabel(u.role)+'</span></div>';
  renderTeachers(); renderSubs(); renderClasses();
})();
function renderTeachers(){
  var t=loadStore().teachers;
  var opt=t.length?t.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>';}).join(''):'<option value="">- Koi teacher nahi (pehle Teachers se add karein) -</option>';
  document.getElementById('c_teacher').innerHTML=opt;
}
function renderSubs(){
  var subs=(loadStore().subjects||[]);
  var list=subs.length?subs.map(function(x){return x.name;}):['Mathematics','English','Science','Urdu','Computer','Islamiat'];
  var h=list.map(function(s){
    var act=selSubs.indexOf(s)>=0;
    return '<span class="chip '+(act?'active':'')+'" onclick="toggleSub(\''+s.replace(/'/g,"\\'")+'\')">'+esc(s)+'</span>';
  }).join(' ');
  document.getElementById('subjChips').innerHTML=h;
}
function toggleSub(s){ var i=selSubs.indexOf(s); if(i>=0) selSubs.splice(i,1); else selSubs.push(s); renderSubs(); }
function renderClasses(){
  var h='';
  classes.forEach(function(c){
    h+='<div class="panel"><h3>Grade '+c.grade+'-'+c.sec+'</h3>'+
    '<div style="font-size:13px;color:var(--slate);margin-bottom:14px">In-charge: <b style="color:var(--charcoal)">'+esc(c.teacher)+'</b></div>'+
    '<div style="display:flex;gap:18px;margin-bottom:14px"><div><b style="font-size:22px;color:var(--primary)">'+c.students+'</b><div style="font-size:12px;color:var(--slate)">Students</div></div>'+
    '<div><b style="font-size:22px;color:var(--primary)">'+c.subs.length+'</b><div style="font-size:12px;color:var(--slate)">Subjects</div></div></div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px">'+c.subs.map(function(s){return '<span class="badge blue">'+esc(s)+'</span>';}).join('')+'</div></div>';
  });
  document.getElementById('classGrid').innerHTML=h;
}
function openAdd(){
  selSubs=[]; renderSubs();
  document.getElementById('c_teacher').value='';
  openModal('addModal');
  setTimeout(function(){ document.getElementById('c_grade').value='1'; },50);
}
function saveClass(){
  var g=document.getElementById('c_grade').value;
  var sec=document.getElementById('c_sec').value;
  var tSel=document.getElementById('c_teacher');
  var tId=tSel.value;
  var tName='Unassigned';
  if(tId){
    var t=loadStore().teachers.find(function(x){return String(x.id)===String(tId);});
    tName=t?t.name:'Unassigned';
  }
  if(!selSubs.length){ showMsg('Kam se kam ek subject select karein.'); return; }
  var newId=Math.max.apply(null,classes.map(function(x){return x.id;}))+1;
  classes.push({id:newId,name:'Grade '+g+'-'+sec,grade:g,sec:sec,teacher:tName,teacherId:tId||null,students:0,subs:selSubs.slice()});
  showMsg('Class Grade '+g+'-'+sec+' add ho gayi');
  closeModal('addModal'); selSubs=[]; renderClasses();
}
</script>
</body>
</html>
